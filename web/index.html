<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>면세점 적용환율</title>
    <!-- 퍼센트로 감싼 LATEST_FIXING 은 빌드 때 최신 고시 문장으로 바뀐다 (vite.config.ts). -->
    <meta
      name="description"
      content="%LATEST_FIXING%. 내일 면세점 환율은 예측이 아니라 오늘 08시에 고시된 사실입니다."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 카카오톡·X·페이스북 링크 미리보기. 이미지 URL 은 절대경로여야 한다.
         canonical·og:url 은 두지 않는다. / 와 /guide 가 같은 index.html 이라
         하나로 박으면 /guide 가 / 의 사본으로 취급된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="면세점 적용환율" />
    <meta property="og:title" content="면세점 적용환율" />
    <meta property="og:description" content="%LATEST_FIXING%" />
    <meta property="og:image" content="https://dutyfree-exchange-rate.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- JS 를 돌리지 않는 크롤러를 위한 문장. createRoot 가 첫 렌더에서 지운다. -->
    <div id="root"><p class="px-6 pt-14 text-center text-muted">%LATEST_FIXING%</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
