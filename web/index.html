<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>면세점 적용환율</title>
    <!-- 네이버 서치어드바이저·구글 서치콘솔 소유 확인. 지우면 소유권이 풀린다. -->
    <meta name="naver-site-verification" content="98ce6a804bc127f5a11b5e7e8cf52907184f5064" />
    <meta name="google-site-verification" content="NdhMlKfMclU9ENuKAn6DpjxTUT_fEwo094dHa6KjFh0" />
    <!-- 퍼센트로 감싼 LATEST_FIXING 은 빌드 때 최신 고시 문장으로 바뀐다 (vite.config.ts). -->
    <meta
      name="description"
      content="%LATEST_FIXING%. 면세점 적용환율은 예측이 아니라 직전 영업일 08시에 고시된 매매기준율입니다."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 카카오톡·X·페이스북 링크 미리보기. 이미지 URL 은 절대경로여야 한다.
         canonical·og:url 은 두지 않는다. / 와 /guide 가 같은 index.html 이라
         하나로 박으면 /guide 가 / 의 사본으로 취급된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="면세점 적용환율" />
    <meta property="og:title" content="면세점 적용환율" />
    <meta property="og:description" content="%LATEST_FIXING%" />
    <meta property="og:image" content="https://dutyfree-exchange-rate.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- JS 를 돌리지 않는 크롤러를 위한 문장. createRoot 가 첫 렌더에서 지운다.
         보이게 두면 JS 가 늦는 동안 화면 가운데 떠 있다가 바뀐다. 숨겨도 본문과
         같은 숫자라 크롤러에게만 다른 말을 하는 게 아니다.
         sr-only 클래스가 아니라 인라인인 까닭: dev 서버는 Tailwind CSS 를 JS 로
         주입해서, JS 가 돌기 전엔 클래스가 아무 일도 하지 않는다. -->
    <div id="root">
      <p
        style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap"
      >
        %LATEST_FIXING%
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
