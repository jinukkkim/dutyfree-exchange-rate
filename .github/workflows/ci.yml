name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      # `--group` (PEP 735) 은 pip 25.1 부터다. 러너 이미지의 pip 이 그보다
      # 낮으면 다음 줄이 "no such option" 으로 죽는다 — 로컬에서 먼저 밟았다.
      - run: pip install --upgrade pip

      - run: pip install -e . --group dev

      - run: pytest

  # web/ 은 Task 8 에서 생긴다. 디렉터리가 없는 채로 job 을 켜두면 CI 가
  # 빨간 채로 시작하므로, 그때 frontend job 을 추가한다.
