name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 커밋을 연달아 밀면 이전 실행을 취소한다. 리뷰 워크플로에는 이걸
# 넣지 않는다 — 거기선 취소된 run 이 추적 코멘트를 "진행 중" 인 채로 남긴다.
# CI 는 남길 코멘트가 없으므로 그 함정이 없다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-latest
    # 스위트가 0.2 초에 끝난다. 10 분을 넘겼다면 테스트가 아니라 설치나
    # 네트워크가 멈춘 것이므로, 기본값 6 시간을 기다릴 이유가 없다.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      # `--group` (PEP 735) 은 pip 25.1 부터다. 러너 이미지의 pip 이 그보다
      # 낮으면 다음 줄이 "no such option" 으로 죽는다 — 로컬에서 먼저 밟았다.
      - run: pip install --upgrade pip

      - run: pip install -e . --group dev

      - run: pytest

  # web/ 은 Task 8 에서 생긴다. 디렉터리가 없는 채로 job 을 켜두면 CI 가
  # 빨간 채로 시작하므로, 그때 frontend job 을 추가한다.
